<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista File della Cartella Web</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .file-item { padding: 8px; border-bottom: 1px solid #ccc; }
        .error-msg { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h1>Articoli trovati nella cartella /articles/:</h1>
    <div id="lista-file-container">Caricamento in corso...</div>

    <script>
    async function mostraListaFile() {
        const container = document.getElementById('lista-file-container');
        container.innerHTML = ''; 
        
        let titoloHomepage = "";

        // 1. SCARICA IL TITOLO DELLA HOMEPAGE PER PROTEZIONE
        try {
            const resIndex = await fetch('/index.html');
            if (resIndex.ok) {
                const htmlIndex = await resIndex.text();
                const parserIndex = new DOMParser();
                const docIndex = parserIndex.parseFromString(htmlIndex, 'text/html');
                titoloHomepage = docIndex.querySelector('title')?.textContent || "";
                console.log(`Titolo della homepage rilevato per blocco di sicurezza: "${titoloHomepage}"`);
            }
        } catch (e) {
            console.log("Nessun file index.html accessibile nella root.");
        }
        
        let indice = 1;
        let continua = true;
        let fileTrovati = 0;
        
        // Puoi rimettere il limite alto (es. 100), si fermerà da solo grazie al titolo
        const LIMITE_MASSIMO = 100; 

        while (continua && indice <= LIMITE_MASSIMO) {
            const nomeFile = `art${indice}.html`;
            const percorsoFile = `/articles/${nomeFile}`; 
            
            try {
                // Richiesta pulita senza parametri extra per non sovraccaricare le estensioni
                const response = await fetch(percorsoFile);
                
                if (response.ok) {
                    const codiceHtml = await response.text();
                    
                    const parser = new DOMParser();
                    const documentoVirtuale = parser.parseFromString(codiceHtml, 'text/html');
                    const titoloFile = documentoVirtuale.querySelector('title')?.textContent || "Nessun titolo";

                    // 2. CONTROLLO ANTI-LOOP SUL TITOLO:
                    // Se il titolo del file scaricato corrisponde a quello della homepage, 
                    // significa che il file artX.html non esiste e Cloudflare ci sta mostrando la home.
                    if (titoloHomepage !== "" && titoloFile === titoloHomepage) {
                        console.log(`Rilevata homepage su ${nomeFile} (Stesso titolo: "${titoloFile}"). Stop.`);
                        continua = false; 
                        break; 
                    }

                    fileTrovati++;
                    
                    const byteSize = new Blob([codiceHtml]).size;
                    const pesoKB = (byteSize / 1024).toFixed(2) + " kB";
                    
                    const elemento = document.createElement('div');
                    elemento.className = 'file-item';
                    elemento.innerHTML = `
                        <strong>Articolo ${fileTrovati}:</strong> 
                        <a href="${percorsoFile}" target="_blank">${nomeFile}</a> 
                        <span style="color: #28a745; margin-left: 10px; font-weight: bold;">(${pesoKB})</span>
                        <span style="color: #555; margin-left: 10px;">— Titolo: "<em>${titoloFile}</em>"</span>
                    `;
                    container.appendChild(elemento);
                    
                    indice++;
                } else {
                    continua = false; 
                }
            } catch (errore) {
                console.error("Errore di rete:", errore);
                continua = false;
            }
        }

        if (fileTrovati === 0) {
            container.innerHTML = '<p class="error-msg">Nessun articolo reale trovato nella cartella /articles/.</p>';
        }
    }

    mostraListaFile();
    </script>

</body>
</html>
