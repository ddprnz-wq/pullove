html<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista File della Cartella Web</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .file-item { padding: 8px; border-bottom: 1px solid #ccc; }
        .error-msg { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h1>File trovati nella cartella:</h1>
    
    <!-- Contenitore in cui verranno mostrati i file -->
    <div id="lista-file-container">Caricamento in corso...</div>

    <script>
    async function mostraListaFile() {
        const container = document.getElementById('lista-file-container');
        container.innerHTML = ''; 
        
        let indice = 1;
        let continua = true;
        let fileTrovati = 0;

        while (continua) {
            // Usa lo schema art1.html, art2.html come hai impostato tu
            const nomeFile = `art${indice}.html`; 
            
            try {
                const response = await fetch(nomeFile);
                
                if (response.ok) {
                    const codiceHtml = await response.text();

                    // CONTROLLO DI SICUREZZA PER GITHUB / CLOUDFLARE PAGES:
                    // Se il file scaricato contiene il titolo di questa pagina di scansione ("Lista File della Cartella Web"),
                    // significa che il server sta imbrogliando e ci sta restituendo la pagina lista.html stessa.
                    if (codiceHtml.includes('<title>Lista File della Cartella Web</title>')) {
                        console.log("Rilevato reindirizzamento alla pagina della lista. Stop.");
                        continua = false; 
                        break; 
                    }

                    fileTrovati++;
                    
                    // Calcolo del peso in kB
                    const byteSize = new Blob([codiceHtml]).size;
                    const pesoKB = (byteSize / 1024).toFixed(2) + " kB";
                    
                    // Estrazione del titolo reale dell'articolo
                    const parser = new DOMParser();
                    const documentoVirtuale = parser.parseFromString(codiceHtml, 'text/html');
                    const titoloFile = documentoVirtuale.querySelector('title')?.textContent || "Nessun titolo";
                    
                    // COSTRUTTORE GRAFICO (Mancava nel tuo codice):
                    // Crea l'elemento visivo e lo appende nella pagina
                    const elemento = document.createElement('div');
                    elemento.className = 'file-item';
                    elemento.innerHTML = `
                        <strong>File ${fileTrovati}:</strong> 
                        <a href="${nomeFile}" target="_blank">${nomeFile}</a> 
                        <span style="color: #28a745; margin-left: 10px; font-weight: bold;">(${pesoKB})</span>
                        <span style="color: #555; margin-left: 10px;">— Titolo: "<em>${titoloFile}</em>"</span>
                    `;
                    container.appendChild(elemento);
                    
                    // Passa al file art successivo
                    indice++;
                } else {
                    // Se risponde con un vero errore 404, ferma il ciclo
                    continua = false;
                }
            } catch (errore) {
                console.error("Errore di rete durante la lettura:", errore);
                continua = false;
            }
        }

        // Se non trova nessun file reale, mostra il messaggio di avviso
        if (fileTrovati === 0) {
            container.innerHTML = '<p class="error-msg">Nessun file trovato.</p>';
        }
    }

    // Esegue la funzione
    mostraListaFile();
    </script>

</body>
</html>
