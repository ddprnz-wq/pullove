html<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista File della Cartella Web</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .file-item { padding: 8px; border-bottom: 1px solid #ccc; }
        .error-msg { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h1>File trovati nella cartella:</h1>
    <div id="lista-file-container">Caricamento in corso...</div>

    <script>
    async function mostraListaFile() {
        const container = document.getElementById('lista-file-container');
        container.innerHTML = ''; 
        
        // Memorizza la lunghezza esatta della pagina attuale per il confronto anti-loop
        const testoPaginaCorrente = document.documentElement.outerHTML;
        
        let indice = 1;
        let continua = true;
        let fileTrovati = 0;
        
        // Massima protezione: non andrà mai oltre i 100 file (puoi aumentare a 500 o 1000 se serve)
        const LIMITE_MASSIMO = 100; 

        while (continua && indice <= LIMITE_MASSIMO) {
            const nomeFile = `art${indice}.html`; 
            
            try {
                const response = await fetch(nomeFile);
                
                if (response.ok) {
                    const codiceHtml = await response.text();

                    // 1. CONTROLLO DI SICUREZZA ANTI-LOOP DEFINITIVO:
                    // Se il testo del file scaricato è identico a questa pagina, ferma tutto.
                    if (codiceHtml === testoPaginaCorrente || codiceHtml.length === testoPaginaCorrente.length) {
                        console.log("Rilevato reindirizzamento loop. Stop.");
                        continua = false; 
                        break; 
                    }

                    // 2. ULTERIORE CONTROLLO: Se il file non contiene la parola 'art', 
                    // ma sei sicuro che i tuoi file veri la contengano nel testo, puoi usarlo come filtro.
                    // Altrimenti controlliamo semplicemente se somiglia a un errore generico di GitHub (solitamente contiene 'github')
                    if (codiceHtml.includes('not found') || codiceHtml.includes('404')) {
                        console.log("Rilevato file di errore mascherato da 200 OK. Stop.");
                        continua = false;
                        break;
                    }

                    fileTrovati++;
                    
                    // Calcolo del peso in kB
                    const byteSize = new Blob([codiceHtml]).size;
                    const pesoKB = (byteSize / 1024).toFixed(2) + " kB";
                    
                    // Estrazione del titolo dell'articolo
                    const parser = new DOMParser();
                    const documentoVirtuale = parser.parseFromString(codiceHtml, 'text/html');
                    const titoloFile = documentoVirtuale.querySelector('title')?.textContent || "Nessun titolo";
                    
                    // Genera la riga nella pagina
                    const elemento = document.createElement('div');
                    elemento.className = 'file-item';
                    elemento.innerHTML = `
                        <strong>File ${fileTrovati}:</strong> 
                        <a href="${nomeFile}" target="_blank">${nomeFile}</a> 
                        <span style="color: #28a745; margin-left: 10px; font-weight: bold;">(${pesoKB})</span>
                        <span style="color: #555; margin-left: 10px;">— Titolo: "<em>${titoloFile}</em>"</span>
                    `;
                    container.appendChild(elemento);
                    
                    indice++;
                } else {
                    // Errore 404 reale (funziona sui server standard)
                    continua = false;
                }
            } catch (errore) {
                console.error("Errore di rete:", errore);
                continua = false;
            }
        }

        if (fileTrovati === 0) {
            container.innerHTML = '<p class="error-msg">Nessun file trovato.</p>';
        }
    }

    mostraListaFile();
    </script>

</body>
</html>
