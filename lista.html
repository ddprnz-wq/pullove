<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista File della Cartella Web</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .file-item { padding: 8px; border-bottom: 1px solid #ccc; }
        .error-msg { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h1>Articoli trovati nella cartella /articles/:</h1>
    <div id="lista-file-container">Caricamento in corso...</div>

    <script>
    async function mostraListaFile() {
        const container = document.getElementById('lista-file-container');
        container.innerHTML = ''; 
        
        let indice = 1;
        let continua = true;
        let fileTrovati = 0;
        const LIMITE_MASSIMO = 50; // Limite di sicurezza

        while (continua && indice <= LIMITE_MASSIMO) {
            // Percorso verso la sottocartella degli articoli
            const nomeFile = `art${indice}.html`;
            const percorsoFile = `/articles/${nomeFile}`; 
            
            try {
                // Aggiungiamo un parametro casuale per bypassare la cache di Cloudflare (?nocache=...)
                const response = await fetch(`${percorsoFile}?nocache=${Date.now()}`);
                
                if (response.ok) {
                    const codiceHtml = await response.text();

                    // CONTROLLO DI SICUREZZA ANTI-LOOP BASATO SUL CONTENUTO:
                    // Se Cloudflare ci rifila la homepage index.html di nascosto, questa conterrà sicuramente 
                    // dei tag o degli id che l'articolo vero NON ha (es. il link a lista.html).
                    if (codiceHtml.includes('lista.html') || codiceHtml.includes('id="lista-file-container"')) {
                        console.log(`Trovato codice della homepage su ${nomeFile}. Stop ciclo.`);
                        continua = false; 
                        break; 
                    }

                    fileTrovati++;
                    
                    // Calcolo del peso in kB
                    const byteSize = new Blob([codiceHtml]).size;
                    const pesoKB = (byteSize / 1024).toFixed(2) + " kB";
                    
                    // Estrazione del titolo dell'articolo
                    const parser = new DOMParser();
                    const documentoVirtuale = parser.parseFromString(codiceHtml, 'text/html');
                    const titoloFile = documentoVirtuale.querySelector('title')?.textContent || "Nessun titolo";
                    
                    // Genera la riga nella pagina lista.html
                    const elemento = document.createElement('div');
                    elemento.className = 'file-item';
                    elemento.innerHTML = `
                        <strong>Articolo ${fileTrovati}:</strong> 
                        <a href="${percorsoFile}" target="_blank">${nomeFile}</a> 
                        <span style="color: #28a745; margin-left: 10px; font-weight: bold;">(${pesoKB})</span>
                        <span style="color: #555; margin-left: 10px;">— Titolo: "<em>${titoloFile}</em>"</span>
                    `;
                    container.appendChild(elemento);
                    
                    indice++;
                } else {
                    continua = false; 
                }
            } catch (errore) {
                console.error("Errore di rete:", errore);
                continua = false;
            }
        }

        if (fileTrovati === 0) {
            container.innerHTML = '<p class="error-msg">Nessun articolo trovato nella cartella /articles/. Controlla che i file siano scritti in minuscolo (es. art1.html).</p>';
        }
    }

    mostraListaFile();
    </script>

</body>
</html>
