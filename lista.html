<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Lista File della Cartella Web</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .file-item { padding: 8px; border-bottom: 1px solid #ccc; }
        .error-msg { color: gray; font-style: italic; }
    </style>
</head>
<body>

    <h1>File trovati nella cartella:</h1>
    <div id="lista-file-container">Caricamento in corso...</div>

    <script>
    async function mostraListaFile() {
        const container = document.getElementById('lista-file-container');
        container.innerHTML = ''; 
        
        let lunghezzaIndex = 0;
        
        // 1. SCARICA L'INDEX PER COSTRUIRE LA PROTEZIONE ANTI-LOOP
        try {
            const resIndex = await fetch('index.html');
            if (resIndex.ok) {
                const testoIndex = await resIndex.text();
                lunghezzaIndex = testoIndex.length; // Memorizza quanti caratteri ha la homepage
            }
        } catch (e) {
            console.log("Nessun file index.html trovato nella root.");
        }
        
        let indice = 1;
        let continua = true;
        let fileTrovati = 0;
        const LIMITE_MASSIMO = 10; // Sicurezza estrema

        while (continua && indice <= LIMITE_MASSIMO) {
            const nomeFile = `art${indice}.html`; 
            
            try {
                const response = await fetch(nomeFile);
                
                if (response.ok) {
                    const codiceHtml = await response.text();

                    // 2. CONTROLLO ANTI-LOOP SU INDEX.HTML:
                    // Se la lunghezza del file scaricato è identica a quella di index.html,
                    // significa che il file reale è finito e il server ci sta imbrogliando.
                    if (codiceHtml.length === lunghezzaIndex) {
                        console.log(`Rilevato reindirizzamento falso a index.html su: ${nomeFile}. Stop.`);
                        continua = false; 
                        break; 
                    }

                    fileTrovati++;
                    
                    // Calcolo del peso in kB
                    const byteSize = new Blob([codiceHtml]).size;
                    const pesoKB = (byteSize / 1024).toFixed(2) + " kB";
                    
                    // Estrazione del titolo dell'articolo
                    const parser = new DOMParser();
                    const documentoVirtuale = parser.parseFromString(codiceHtml, 'text/html');
                    const titoloFile = documentoVirtuale.querySelector('title')?.textContent || "Nessun titolo";
                    
                    // Inserimento visivo nella pagina
                    const elemento = document.createElement('div');
                    elemento.className = 'file-item';
                    elemento.innerHTML = `
                        <strong>File ${fileTrovati}:</strong> 
                        <a href="${nomeFile}" target="_blank">${nomeFile}</a> 
                        <span style="color: #28a745; margin-left: 10px; font-weight: bold;">(${pesoKB})</span>
                        <span style="color: #555; margin-left: 10px;">— Titolo: "<em>${titoloFile}</em>"</span>
                    `;
                    container.appendChild(elemento);
                    
                    indice++;
                } else {
                    continua = false; // Errore 404 standard
                }
            } catch (errore) {
                console.error("Errore di rete:", errore);
                continua = false;
            }
        }

        if (fileTrovati === 0) {
            container.innerHTML = '<p class="error-msg">Nessun file trovato.</p>';
        }
    }

    mostraListaFile();
    </script>

</body>
</html>
